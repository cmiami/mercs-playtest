<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mercs</title>
    <style>
      :root { --bg: #0b0c0e; --panel: #15171b; --line: #2a2d33; --text: #d8d9dc; --dim: #8a8e96; --accent: #d9a441; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100%;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; }
      #stage { position: relative; background: #000; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; image-rendering: pixelated; }
      .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: rgba(0, 0, 0, 0.72); text-align: center; }
      #loading .title { font-size: 28px; letter-spacing: 0.3em; color: var(--accent); }
      #bar { width: min(360px, 70%); height: 6px; background: var(--line); }
      #fill { width: 0; height: 100%; background: var(--accent); transition: width 0.15s; }
      #status { color: var(--dim); font-size: 12px; min-height: 1.4em; }
      #focus { cursor: pointer; display: none; }
      #focus span { border: 1px solid var(--accent); color: var(--accent); padding: 10px 22px; letter-spacing: 0.15em; }
      #bottom { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0 0; }
      #controls { color: var(--dim); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
      #controls b { color: var(--text); font-weight: 600; }
      button { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 7px 14px; font: inherit;
        cursor: pointer; white-space: nowrap; }
      button:hover { border-color: var(--accent); }
      #error { color: #e06c5a; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading" class="cover">
        <div class="title">MERCS</div>
        <div id="bar"><div id="fill"></div></div>
        <div id="status">Loading…</div>
      </div>
      <div id="focus" class="cover"><span>CLICK TO PLAY</span></div>
    </div>
    <div id="bottom">
      <div id="controls">
        <span><b>A/D</b> move</span><span><b>Space</b> jump, climb</span><span><b>W/S</b> stairs, doors, cover</span>
        <span><b>Shift</b> sprint</span><span><b>F</b> dash</span><span><b>C</b> crouch</span><span><b>Mouse</b> aim</span><span><b>LMB</b> fire</span>
        <span><b>RMB</b> steady aim</span><span><b>R</b> reload</span><span><b>G</b> grenade</span><span><b>1/2/3</b> guns</span>
        <span><b>Q</b> quick swap</span><span><b>H</b> stow</span><span><b>E</b> use, takedown</span><span><b>Tab</b> inventory</span>
        <span><b>T</b> taunt</span><span><b>M</b> music</span><span><b>Esc</b> menu</span>
      </div>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
    <script src="Build/Web.loader.js?v=bea2d981aeb5b750"></script>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var stage = document.getElementById("stage");
      var bottom = document.getElementById("bottom");
      var loading = document.getElementById("loading");
      var focusCover = document.getElementById("focus");
      var REF_W = 1280, REF_H = 720;

      // The game renders at 1280x720 and upscales: the canvas takes the largest whole multiple of that in device pixels
      // that fits the window (every game pixel an equal square), else the largest 16:9 that fits.
      function layout() {
        var dpr = window.devicePixelRatio || 1;
        var availW = window.innerWidth - 24, availH = window.innerHeight - bottom.offsetHeight - 24;
        var scale = Math.floor(Math.min(availW * dpr / REF_W, availH * dpr / REF_H));
        var w, h;
        if (scale >= 1) { w = REF_W * scale / dpr; h = REF_H * scale / dpr; }
        else { var f = Math.min(availW / REF_W, availH / REF_H); w = REF_W * f; h = REF_H * f; }
        stage.style.width = w + "px"; stage.style.height = h + "px";
        bottom.style.width = Math.max(w, 320) + "px";
      }
      window.addEventListener("resize", layout);
      layout();

      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      function showFocus(on) { focusCover.style.display = on ? "flex" : "none"; }
      focusCover.addEventListener("mousedown", function (e) { e.preventDefault(); showFocus(false); canvas.focus(); });
      window.addEventListener("blur", function () { if (window.unityInstance && !document.fullscreenElement) showFocus(true); });

      var config = {
        arguments: [],
        dataUrl: null,
        frameworkUrl: "Build/Web.framework.js.unityweb?v=83a102ede847501e",
        codeUrl: "Build/Web.wasm.unityweb?v=a08b1223396de2c7",
        streamingAssetsUrl: "StreamingAssets",
        cacheControl: function (url) { return "no-store"; },
        companyName: "Sprites",
        productName: "Mercs",
        productVersion: "1.0",
        showBanner: function (msg, type) {
          if (type === "error") { var s = document.getElementById("status"); s.id = "error"; s.textContent = msg; loading.style.display = "flex"; }
          else console.warn(msg);
        },
      };

      // The packed data is over the host's 100 MB file limit, so it ships in parts; they are joined here into one blob
      // the loader reads as its data file. The parts stay in the browser's HTTP cache between visits.
      var DATA_PARTS = ["Build/Web.data.unityweb.parta?v=109e061699a35ee2", "Build/Web.data.unityweb.partb?v=f1624177acb6d6b3"];
      var DATA_BYTES = 124027588;
      function setProgress(fraction, text) {
        document.getElementById("fill").style.width = Math.round(fraction * 100) + "%";
        document.getElementById("status").textContent = text;
      }
      function fetchData() {
        var received = 0;
        return Promise.all(DATA_PARTS.map(function (url) {
          return fetch(url).then(function (response) {
            if (!response.ok) throw new Error("Could not download " + url + " (" + response.status + ")");
            var reader = response.body.getReader(), chunks = [];
            function pump() {
              return reader.read().then(function (step) {
                if (step.done) return new Blob(chunks);
                chunks.push(step.value);
                received += step.value.length;
                var f = Math.min(received / DATA_BYTES, 1);
                setProgress(f * 0.85, "Loading… " + Math.round(f * 85) + "%");
                return pump();
              });
            }
            return pump();
          });
        })).then(function (blobs) { return URL.createObjectURL(new Blob(blobs)); });
      }

      fetchData().then(function (dataUrl) {
        config.dataUrl = dataUrl;
        return createUnityInstance(canvas, config, function (progress) {
          setProgress(0.85 + progress * 0.15, progress < 0.9 ? "Loading… " + Math.round(85 + progress * 15) + "%" : "Starting…");
        });
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        loading.style.display = "none";
        showFocus(true);
        document.getElementById("fullscreen").onclick = function () { unityInstance.SetFullscreen(1); };
      }).catch(function (message) {
        var s = document.getElementById("status"); s.id = "error"; s.textContent = message;
      });
    </script>
  </body>
</html>
